    <div class="actionitem" draggable="true" onclick="UI.editOptionId='${o.id}';renderEdit()"
      ondragstart="dragRow(event,${i},'options')" ondragover="overRow(event,this)" ondragleave="this.classList.remove('dragover')" ondrop="dropRow(event,${i},'options',this)">
      <span class="draghandle" title="drag to sort" onclick="event.stopPropagation()">⠿</span>
      <div class="info"><div class="nm">${esc(o.name)}</div><div class="desc">${esc(o.description || "")}</div></div>
      <span class="rowmove">
        <button onclick="event.stopPropagation();moveItem('options',${i},-1)" title="move up">▲</button>
        <button onclick="event.stopPropagation();moveItem('options',${i},1)" title="move down">▼</button>
      </span>
      <span class="muted">✎</span>
    </div>`).join("");
  return `<div class="hint" style="margin-bottom:10px">Options are toggles that appear on matching actions — combos like Sneak Attack, Steady Aim, Divine Smite, feats, fighting styles…</div>
    ${rows}<div class="btnrow" style="margin-top:10px">
      <button class="btn" onclick="addOption()">＋ New option</button>
      <select id="featPick">${FEAT_LIBRARY.map((f, i) => `<option value="${i}">${esc(f.name)}</option>`).join("")}</select>
      <button class="btn" onclick="addFeatFromLibrary()">＋ Add feat from 2024 list</button>
    </div>`;
}

function addFeatFromLibrary() {
  const f = FEAT_LIBRARY[parseInt($("#featPick").value, 10)];
  const o = featOption(f.name);
  currentChar().options.push(o); UI.editOptionId = o.id; saveDB(); renderEdit();
}

function optionFormHtml(ch, o) {
  const fx = o.effects;
  const diceRows = (fx.dice || []).map((d, i) => `<div class="formrow">
    <label>Dice <input type="text" value="${esc(d.expr)}" onchange="updOptDice('${o.id}',${i},'expr',this.value)"></label>
    <label>Type <select onchange="updOptDice('${o.id}',${i},'type',this.value)">
      <option value="" ${!d.type ? "selected" : ""}>same as action</option>
      ${DAMAGE_TYPES.map(t => `<option ${d.type === t ? "selected" : ""}>${t}</option>`).join("")}</select></label>
    <button class="btn small danger" style="align-self:flex-end" onclick="removeOptDice('${o.id}',${i})">remove</button>
  </div>`).join("");
  const flagRows = (fx.setFlags || []).map((f, i) => `<div class="formrow">
    <label>Marker text <input type="text" style="width:260px" value="${esc(f.label)}" onchange="updOptFlag('${o.id}',${i},'label',this.value)"></label>
    <label>Clears on <select onchange="updOptFlag('${o.id}',${i},'clear',this.value)">
      ${["turn","encounter","rest","manual"].map(c => `<option ${f.clear === c ? "selected" : ""}>${c}</option>`).join("")}</select></label>
    <button class="btn small danger" style="align-self:flex-end" onclick="removeOptFlag('${o.id}',${i})">remove</button>
  </div>`).join("");
  const resRows = (fx.resourceCosts || []).map((c, i) => `<div class="formrow">
    <label>Resource <select onchange="updOptRes('${o.id}',${i},'id',this.value)">
      ${ch.resources.map(r => `<option value="${r.id}" ${c.id === r.id ? "selected" : ""}>${esc(r.name)}</option>`).join("")}</select></label>
    <label>Amount <input type="number" style="width:64px" value="${c.amount || 1}" onchange="updOptRes('${o.id}',${i},'amount',parseInt(this.value)||1)"></label>
    <button class="btn small danger" style="align-self:flex-end" onclick="removeOptRes('${o.id}',${i})">remove</button>
  </div>`).join("");

  return `<div class="card" style="border-color:var(--gold)">
    <div class="formrow">
      <label>Name <input type="text" style="width:220px" value="${esc(o.name)}" onchange="updOption('${o.id}','name',this.value)"></label>
      <label style="flex-direction:row;align-items:center;gap:6px">On by default <input type="checkbox" ${o.defaultOn ? "checked" : ""} onchange="updOption('${o.id}','defaultOn',this.checked)"></label>
    </div>
    <div class="formrow"><label class="full">Description <textarea onchange="updOption('${o.id}','description',this.value)">${esc(o.description || "")}</textarea></label></div>
    <fieldset><legend>Appears on which actions?</legend>
      <div class="formrow">
        <label>Mode <select onchange="updApplies('${o.id}','mode',this.value)">
          <option value="all" ${o.applies.mode === "all" ? "selected" : ""}>all actions</option>
          <option value="tags" ${o.applies.mode === "tags" ? "selected" : ""}>actions with tag…</option>
          <option value="actions" ${o.applies.mode === "actions" ? "selected" : ""}>specific actions</option></select></label>
        ${o.applies.mode === "tags" ? `<label>Tags (any matches) <input type="text" style="width:240px" value="${esc((o.applies.tags || []).join(", "))}" onchange="updApplies('${o.id}','tags',this.value.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean))"></label>` : ""}
        <label>Requires <select onchange="updOption('${o.id}','requires',this.value)">
          <option value="any" ${o.requires === "any" ? "selected" : ""}>—</option>
          <option value="attack" ${o.requires === "attack" ? "selected" : ""}>an attack roll</option></select></label>
      </div>
      ${o.applies.mode === "actions" ? `<div class="formrow">${ch.actions.map(a => `
        <label style="flex-direction:row;align-items:center;gap:5px"><input type="checkbox" ${(o.applies.actionIds || []).includes(a.id) ? "checked" : ""} onchange="toggleAppliesAction('${o.id}','${a.id}',this.checked)">${esc(a.name)}</label>`).join("")}</div>` : ""}
    </fieldset>
    <fieldset><legend>Effects</legend>
      ${diceRows}<button class="btn small" onclick="addOptDice('${o.id}')">＋ Extra damage dice</button>
      <div class="hint">${DICE_HINT}</div>
      <div class="formrow" style="margin-top:8px">
        <label style="flex-direction:row;align-items:center;gap:6px">Advantage <input type="checkbox" ${fx.advantage ? "checked" : ""} onchange="updEffect('${o.id}','advantage',this.checked)"></label>
        <label style="flex-direction:row;align-items:center;gap:6px">Disadvantage <input type="checkbox" ${fx.disadvantage ? "checked" : ""} onchange="updEffect('${o.id}','disadvantage',this.checked)"></label>
        <label style="flex-direction:row;align-items:center;gap:6px">Auto-crit <input type="checkbox" ${fx.autoCrit ? "checked" : ""} onchange="updEffect('${o.id}','autoCrit',this.checked)"></label>
        <label style="flex-direction:row;align-items:center;gap:6px">Once per turn <input type="checkbox" ${fx.oncePerTurn ? "checked" : ""} onchange="updEffect('${o.id}','oncePerTurn',this.checked)"></label>
        <label style="flex-direction:row;align-items:center;gap:6px">Speed → 0 <input type="checkbox" ${fx.speedZero ? "checked" : ""} onchange="updEffect('${o.id}','speedZero',this.checked)"></label>
      </div>
      <div class="formrow">
        <label>Extra action cost <select onchange="updEffect('${o.id}','time',this.value==='none'?null:this.value)">
          ${["none","action","bonus","reaction"].map(t => `<option value="${t}" ${(fx.time || "none") === t ? "selected" : ""}>${t}</option>`).join("")}</select></label>
        <label>Uses spell slot of level <select onchange="updEffect('${o.id}','slotCost',parseInt(this.value))">
          ${[0,1,2,3,4,5].map(l => `<option value="${l}" ${fx.slotCost === l ? "selected" : ""}>${l === 0 ? "no" : l}</option>`).join("")}</select></label>
        ${fx.slotCost > 0 ? `<label>Upcast dice / level <input type="text" style="width:80px" value="${esc((fx.upcast && fx.upcast.expr) || "")}" onchange="updOptUpcast('${o.id}','expr',this.value)"></label>
        <label>Upcast type <select onchange="updOptUpcast('${o.id}','type',this.value)">
          <option value="" ${!(fx.upcast && fx.upcast.type) ? "selected" : ""}>same as action</option>
          ${DAMAGE_TYPES.map(t => `<option ${(fx.upcast && fx.upcast.type) === t ? "selected" : ""}>${t}</option>`).join("")}</select></label>` : ""}
      </div>
      ${useResources() ? `${resRows}<button class="btn small" onclick="addOptRes('${o.id}')" ${ch.resources.length ? "" : "disabled title='no resources defined'"}>＋ Resource cost</button>` : ""}
      <div style="margin-top:8px">${flagRows}<button class="btn small" onclick="addOptFlag('${o.id}')">＋ Marker on the sheet</button></div>
      <div class="formrow" style="margin-top:8px"><label class="full">Instruction note (supports {DC}, {DC-DEX}, {PB}, {MOD}, {L})
        <textarea onchange="updEffect('${o.id}','note',this.value)">${esc(fx.note || "")}</textarea></label></div>
    </fieldset>
    <div class="editrowbtns">
      <button class="btn small" onclick="duplicateOption('${o.id}')">⧉ Duplicate</button>
      <button class="btn small danger" onclick="deleteOption('${o.id}')">✕ Delete</button>
      <button class="btn small primary" onclick="UI.editOptionId=null;renderEdit()">Done</button>
    </div>
  </div>`;
}

function findOption(id) { return currentChar().options.find(o => o.id === id); }
function updOption(id, f, v) { findOption(id)[f] = v; saveDB(); renderEdit(); }
function updEffect(id, f, v) { findOption(id).effects[f] = v; saveDB(); renderEdit(); }
function updApplies(id, f, v) { findOption(id).applies[f] = v; saveDB(); renderEdit(); }
function toggleAppliesAction(id, actionId, on) {
  const arr = findOption(id).applies.actionIds || (findOption(id).applies.actionIds = []);
  const i = arr.indexOf(actionId);
  if (on && i < 0) arr.push(actionId); if (!on && i >= 0) arr.splice(i, 1);
  saveDB(); renderEdit();
}
function updOptDice(id, i, f, v) { findOption(id).effects.dice[i][f] = v; saveDB(); renderEdit(); }
function addOptDice(id) { findOption(id).effects.dice.push({ expr: "1d6", type: "" }); saveDB(); renderEdit(); }
function removeOptDice(id, i) { findOption(id).effects.dice.splice(i, 1); saveDB(); renderEdit(); }
function updOptFlag(id, i, f, v) { findOption(id).effects.setFlags[i][f] = v; saveDB(); renderEdit(); }
function addOptFlag(id) { const fx = findOption(id).effects; (fx.setFlags = fx.setFlags || []).push({ label: "Effect active", clear: "manual" }); saveDB(); renderEdit(); }
function removeOptFlag(id, i) { findOption(id).effects.setFlags.splice(i, 1); saveDB(); renderEdit(); }
function updOptRes(id, i, f, v) { findOption(id).effects.resourceCosts[i][f] = v; saveDB(); renderEdit(); }
function addOptRes(id) { const ch = currentChar(); findOption(id).effects.resourceCosts.push({ id: ch.resources[0].id, amount: 1 }); saveDB(); renderEdit(); }
function removeOptRes(id, i) { findOption(id).effects.resourceCosts.splice(i, 1); saveDB(); renderEdit(); }
function updOptUpcast(id, f, v) {
  const fx = findOption(id).effects;
  fx.upcast = fx.upcast || { expr: "1d8", type: "" };
  fx.upcast[f] = v; saveDB(); renderEdit();
}
function addOption() { const o = makeOption({ name: "New option", description: "" }); currentChar().options.push(o); UI.editOptionId = o.id; saveDB(); renderEdit(); }
function duplicateOption(id) {
  const o = JSON.parse(JSON.stringify(findOption(id)));
  o.id = uid(); o.name += " (copy)";
  currentChar().options.push(o); UI.editOptionId = o.id; saveDB(); renderEdit();
}
function deleteOption(id) {
  if (!confirm("Delete this option?")) return;
  const ch = currentChar(); ch.options = ch.options.filter(o => o.id !== id);
  UI.editOptionId = null; saveDB(); renderEdit();
}

/* ---------------- MENU / EXPORT / IMPORT ---------------- */
function download(filename, text) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "application/json" }));
  a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

function menuAction(what) {
  $("#menuPanel").classList.add("hidden");
  const ch = currentChar();
  if (what === "new") {
    const c = blankCharacter(prompt("Character name?", "New Hero") || "New Hero");
    DB.characters.push(c); DB.currentId = c.id; saveDB(); render();
  } else if (what === "duplicate") {
    const c = JSON.parse(JSON.stringify(ch)); c.id = uid(); c.name += " (copy)";
    DB.characters.push(c); DB.currentId = c.id; saveDB(); render();
  } else if (what === "export") {
    download(ch.name.replace(/[^\w-]+/g, "_") + ".json", JSON.stringify(ch, null, 2));
  } else if (what === "exportAll") {
    download("dnd-party.json", JSON.stringify({ characters: DB.characters }, null, 2));
  } else if (what === "import") {
    $("#importFile").click();
  } else if (what === "delete") {
    if (DB.characters.length <= 1) { alert("Can't delete the last character."); return; }
    if (!confirm(`Delete "${ch.name}"? This cannot be undone (export first if unsure).`)) return;
    DB.characters = DB.characters.filter(c => c.id !== ch.id);
    DB.currentId = DB.characters[0].id; saveDB(); render();
  }
}

function importJson(text) {
  let data;
  try { data = JSON.parse(text); } catch (e) { alert("Not a valid JSON file."); return; }
  let list = Array.isArray(data) ? data : (data.characters ? data.characters : [data]);
  let count = 0;
  for (const c of list) {
    if (!c || !c.name || !Array.isArray(c.actions)) continue;
    if (DB.characters.some(x => x.id === c.id)) c.id = uid();
    c.state = Object.assign(freshState(), c.state || {});
    DB.characters.push(c); DB.currentId = c.id; count++;
  }
  saveDB(); render();
  alert(count ? `Imported ${count} character(s).` : "No characters found in that file.");
}

/* ============================================================
   SECTION 8: INIT
   ============================================================ */
function init() {
  loadDB();
  $$("nav.tabs button").forEach(b => b.addEventListener("click", () => { UI.tab = b.dataset.tab; render(); }));
  $("#charSelect").addEventListener("change", e => { DB.currentId = e.target.value; UI.editActionId = UI.editOptionId = null; saveDB(); render(); });
  $("#menuBtn").addEventListener("click", e => { e.stopPropagation(); $("#menuPanel").classList.toggle("hidden"); });
  document.addEventListener("click", e => { if (!$("#menuPanel").contains(e.target) && e.target !== $("#menuBtn")) $("#menuPanel").classList.add("hidden"); });
  $$("#menuPanel button").forEach(b => b.addEventListener("click", () => menuAction(b.dataset.menu)));
  $("#importFile").addEventListener("change", e => {
    const f = e.target.files[0];
    if (f) f.text().then(importJson);
    e.target.value = "";
  });
  render();
}
if (typeof document !== "undefined" && document.readyState !== "loading") init();
else if (typeof document !== "undefined") document.addEventListener("DOMContentLoaded", init);
</script>
