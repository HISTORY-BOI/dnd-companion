<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>D&D Party Companion</title>
<style>
/* ============================================================
   THEME & RESET
   ============================================================ */
:root {
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --bg: #ece0c2;
  --bg2: #e2d3ac;
  --card: #f6ecd2;
  --ink: #38291a;
  --ink-soft: #7a6547;
  --line: #c3a878;
  --line-strong: #9c7f4e;
  --accent: #7a1a22;
  --accent-soft: #ecd4c4;
  --gold: #8c6b1f;
  --gold-bright: #b98f2e;
  --good: #4a6b2f;
  --warn: #9c4a14;
  --pip: #7a1a22;
  --pip-empty: #cdb488;
  --header-bg: linear-gradient(180deg, #3b2417 0%, #271609 100%);
  --header-ink: #e7c56b;
  --paper: radial-gradient(ellipse 120% 90% at 50% -10%, rgba(255,248,222,.9), transparent 60%),
           radial-gradient(ellipse 140% 100% at 50% 110%, rgba(140,107,31,.14), transparent 55%);
  --shadow: 0 1px 4px rgba(56,41,26,.22);
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #191310;
    --bg2: #241b13;
    --card: #241c12;
    --ink: #e8d8b4;
    --ink-soft: #a68f68;
    --line: #4d3c22;
    --line-strong: #6e5730;
    --accent: #d1857c;
    --accent-soft: #45231d;
    --gold: #d4a848;
    --gold-bright: #e8c568;
    --good: #8fbf6f;
    --warn: #e0954e;
    --pip: #b3454f;
    --pip-empty: #4d3c22;
    --header-bg: linear-gradient(180deg, #2c1b0f 0%, #180d05 100%);
    --header-ink: #e7c56b;
    --paper: radial-gradient(ellipse 120% 90% at 50% -10%, rgba(232,197,104,.06), transparent 60%),
             radial-gradient(ellipse 140% 100% at 50% 110%, rgba(0,0,0,.5), transparent 55%);
    --shadow: 0 1px 4px rgba(0,0,0,.5);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--serif);
  background: var(--bg);
  background-image: var(--paper),
    repeating-linear-gradient(0deg, transparent 0 2px, rgba(120,90,40,.02) 2px 4px);
  background-attachment: fixed;
  color: var(--ink);
  font-size: 15.5px;
  line-height: 1.45;
  padding-bottom: 70px; /* room for bottom tab bar */
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, select, textarea {
  font: inherit; color: var(--ink);
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 6px 8px;
  max-width: 100%;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--gold); outline-offset: 0; }
h1,h2,h3,h4 { line-height: 1.2; }

/* ============================================================
   LAYOUT: HEADER + TABS
   ============================================================ */
header {
  position: sticky; top: 0; z-index: 20;
  background: var(--header-bg); color: var(--header-ink);
  padding: 10px 14px;
  display: flex; align-items: center; gap: 10px;
  border-bottom: 3px double var(--gold-bright);
  box-shadow: 0 2px 8px rgba(0,0,0,.35);
}
header h1 {
  font-size: 18px; font-variant: small-caps; letter-spacing: 1.5px; white-space: nowrap;
  font-weight: 700; text-shadow: 0 1px 2px rgba(0,0,0,.6);
}
#charSelect {
  flex: 1; min-width: 0;
  background: rgba(0,0,0,.35); color: var(--header-ink);
  border: 1px solid rgba(231,197,107,.45); border-radius: 4px;
  font-weight: 600; font-family: var(--serif);
}
#charSelect option { color: #000; }
#menuBtn { font-size: 20px; padding: 2px 8px; color: var(--header-ink); }

nav.tabs {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
  display: flex;
  background: var(--card);
  border-top: 2px solid var(--line-strong);
  box-shadow: 0 -2px 8px rgba(56,41,26,.18);
  padding-bottom: env(safe-area-inset-bottom);
}
nav.tabs button {
  flex: 1; padding: 12px 0 10px;
  font-family: var(--serif); font-variant: small-caps; letter-spacing: 1px;
  font-size: 14px; font-weight: 700; color: var(--ink-soft);
  border-top: 3px solid transparent;
}
nav.tabs button.active { color: var(--accent); border-top-color: var(--gold-bright); }
nav.tabs button .ico { display: block; font-size: 19px; margin-bottom: 1px; }

main { max-width: 860px; margin: 0 auto; padding: 12px; }
@media (min-width: 700px) {
  body { padding-bottom: 20px; }
  nav.tabs { position: sticky; top: 49px; bottom: auto; border-top: none; border-bottom: 1px solid var(--line); }
  nav.tabs button { padding: 9px 0; }
  nav.tabs button .ico { display: inline; margin-right: 5px; font-size: 15px; }
  nav.tabs button.active { border-top-color: transparent; box-shadow: inset 0 -3px 0 var(--accent); }
}

/* ============================================================
   GENERIC COMPONENTS
   ============================================================ */
.card {
  background: var(--card);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  box-shadow: var(--shadow), inset 0 0 0 1px var(--card), inset 0 0 0 2px var(--line);
  padding: 14px;
  margin-bottom: 12px;
}
.card h3 {
  display: flex; align-items: center; gap: 10px;
  font-variant: small-caps; text-transform: none; font-size: 15px; letter-spacing: 1.5px;
  color: var(--gold); margin-bottom: 8px; font-weight: 700;
}
.card h3::after {
  content: ""; flex: 1; height: 1px;
  background: linear-gradient(to right, var(--line-strong), transparent);
}
.grid { display: grid; gap: 10px; }
.muted { color: var(--ink-soft); font-size: 13px; }
.pill {
  display: inline-block; padding: 1px 8px; border-radius: 999px;
  font-size: 11px; font-weight: 700; letter-spacing: .3px;
  background: var(--bg2); border: 1px solid var(--line); color: var(--ink-soft);
  vertical-align: 1px;
}
.pill.action   { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.pill.bonus    { background: #e9edd7; color: #5a6a1e; border-color: transparent; }
.pill.reaction { background: #ddeaf2; color: #29586e; border-color: transparent; }
@media (prefers-color-scheme: dark) {
  .pill.bonus    { background: #37391f; color: #c4d17a; }
  .pill.reaction { background: #1e3340; color: #8fc3dd; }
}
.btn {
  display: inline-block; padding: 8px 16px; border-radius: 5px;
  background: linear-gradient(180deg, var(--card), var(--bg2));
  border: 1px solid var(--line-strong);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 1px 2px rgba(56,41,26,.2);
  font-family: var(--serif); font-variant: small-caps; letter-spacing: .8px;
  font-weight: 700; font-size: 15px;
}
.btn:active { transform: translateY(1px); box-shadow: none; }
.btn.primary {
  background: linear-gradient(180deg, #93313a, #6b141c);
  border-color: #4c0d13; color: #f3e3b8;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 1px 3px rgba(56,41,26,.35);
  text-shadow: 0 1px 1px rgba(0,0,0,.4);
}
.btn.small { padding: 4px 11px; font-size: 13.5px; }
.btn.danger { color: var(--accent); border-color: var(--accent); background: none; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }

/* pips (spell slots, resources) — diamond-cut gems */
.pips { display: inline-flex; flex-wrap: wrap; gap: 8px; vertical-align: middle; padding: 2px 4px; }
.pip {
  width: 16px; height: 16px; border-radius: 3px;
  transform: rotate(45deg);
  border: 2px solid var(--pip);
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.45), transparent 55%), var(--pip);
  box-shadow: 0 1px 2px rgba(56,41,26,.35);
  cursor: pointer; padding: 0;
}
.pip.empty { background: transparent; border-color: var(--pip-empty); box-shadow: none; }

/* ============================================================
   SHEET VIEW
   ============================================================ */
.namecard { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.charname { font-size: 20px; font-variant: small-caps; letter-spacing: .8px; }
.portrait {
  width: 74px; height: 74px; object-fit: cover; object-position: top;
  border: 2px solid var(--gold); border-radius: 5px;
  box-shadow: 0 0 0 1px var(--card), 0 0 0 2px var(--line-strong), 0 2px 6px rgba(56,41,26,.35);
  flex: none;
}
.portrait.placeholder {
  display: flex; align-items: center; justify-content: center;
  font-size: 30px; background: var(--bg2); color: var(--ink-soft);
  border-color: var(--line-strong);
}
.portrait.editpreview { width: 110px; height: 110px; }
.statrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(66px, 1fr)); gap: 8px; margin-bottom: 12px; }

/* skills */
.skills { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 3px 16px; }
.skill { display: flex; align-items: baseline; gap: 7px; font-size: 14px; color: var(--ink-soft); }
.skill.trained { color: var(--ink); }
.skill .sn { flex: 1; }
.skill .dot { color: var(--pip-empty); font-size: 12px; }
.skill .dot.l1 { color: var(--gold); }
.skill .dot.l2 { color: var(--accent); }

/* equipment & coin */
.equiprow { display: flex; align-items: center; gap: 8px; padding: 3px 0; border-bottom: 1px dotted var(--line); }
.equiprow .eqname { flex: 1; }
.equiprow .eqqty { min-width: 26px; text-align: center; }
.equiprow .eqdel { color: var(--accent); font-size: 17px; padding: 0 6px; }
.coinrow { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.coin { display: flex; flex-direction: column; font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--gold); }
.coin input { width: 64px; }

/* drag & drop sorting */
.draghandle { cursor: grab; color: var(--ink-soft); font-size: 15px; padding: 0 2px; user-select: none; }
.rowmove { display: flex; flex-direction: column; gap: 1px; }
.rowmove button { font-size: 10px; line-height: 1.2; color: var(--ink-soft); padding: 1px 5px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg2); }
.actionitem.dragover { border-top: 3px solid var(--gold-bright); }
.stat {
  background: var(--card); border: 1px solid var(--line-strong); border-radius: var(--radius);
  box-shadow: var(--shadow), inset 0 0 0 1px var(--card), inset 0 0 0 2px var(--line);
  text-align: center; padding: 8px 4px;
}
.stat .v { font-size: 24px; font-weight: 700; font-family: var(--serif); }
.stat .v.zeroed { color: var(--warn); }
.stat .l { font-size: 11px; font-variant: small-caps; letter-spacing: 1.5px; color: var(--gold); font-weight: 700; }
.abilities { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 12px; }
@media (max-width: 480px) { .abilities { grid-template-columns: repeat(3, 1fr); } }
.ab {
  background: var(--card); border: 1px solid var(--line-strong); border-radius: var(--radius);
  box-shadow: var(--shadow), inset 0 0 0 1px var(--card), inset 0 0 0 2px var(--line);
  text-align: center; padding: 7px 2px;
}
.ab .name { font-size: 11px; font-variant: small-caps; letter-spacing: 1.5px; color: var(--gold); font-weight: 700; }
.ab .mod { font-size: 21px; font-weight: 700; font-family: var(--serif); }
.ab .score { font-size: 11px; color: var(--ink-soft); }
.hpbar { height: 10px; border-radius: 5px; background: var(--pip-empty); overflow: hidden; margin: 6px 0; }
.hpbar > div { height: 100%; background: var(--good); border-radius: 5px; transition: width .2s; }
.hpbar > div.low { background: var(--warn); }
.hpbar > div.crit { background: var(--accent); }
.hpctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.hpctl .bignum { font-size: 26px; font-weight: 800; min-width: 90px; }
.stepper { display: inline-flex; align-items: center; gap: 2px; }
.stepper button {
  width: 30px; height: 30px; border-radius: 7px; font-size: 17px; font-weight: 700;
  background: var(--bg2); border: 1px solid var(--line);
}
.slotrow { display: flex; align-items: center; gap: 8px; margin: 4px 0; flex-wrap: wrap; }
.slotrow .lvl { width: 34px; font-weight: 700; font-size: 13px; color: var(--ink-soft); }
.flag {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--accent-soft); color: var(--accent);
  padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600;
  margin: 2px 4px 2px 0;
}
.flag button { font-size: 15px; line-height: 1; color: inherit; }
.economy { display: flex; gap: 8px; margin-bottom: 8px; }
.econ {
  flex: 1; text-align: center; padding: 6px 2px; border-radius: 5px;
  border: 1px dashed var(--line-strong); font-size: 13px; font-weight: 700; color: var(--ink-soft);
  font-variant: small-caps; letter-spacing: 1px;
}
.econ.used { background: var(--accent-soft); color: var(--accent); border-style: solid; text-decoration: line-through; }
#log { font-size: 12.5px; color: var(--ink-soft); }
#log div { padding: 3px 0; border-bottom: 1px dotted var(--line); }

/* ============================================================
   ACTIONS VIEW
   ============================================================ */
.filterbar { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.filterbar input[type=search] { flex: 1; min-width: 140px; }
.chip {
  padding: 5px 13px; border-radius: 999px; font-size: 13.5px; font-weight: 700;
  font-family: var(--serif); font-variant: small-caps; letter-spacing: .5px;
  background: var(--card); border: 1px solid var(--line-strong); color: var(--ink-soft);
}
.chip.active { background: linear-gradient(180deg, #93313a, #6b141c); border-color: #4c0d13; color: #f3e3b8; }
.actionitem {
  display: flex; align-items: center; gap: 10px;
  background: var(--card); border: 1px solid var(--line-strong); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 10px 12px; margin-bottom: 8px;
  cursor: pointer;
  border-left: 4px solid var(--line-strong);
}
.actionitem:hover { border-color: var(--gold-bright); }
.actionitem .info { flex: 1; min-width: 0; }
.actionitem .nm { font-weight: 700; }
.actionitem .desc {
  font-size: 12.5px; color: var(--ink-soft);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.actionitem .dmg { text-align: right; font-size: 13px; font-weight: 700; white-space: nowrap; }
.actionitem .dmg .sub { display: block; font-size: 11px; font-weight: 400; color: var(--ink-soft); }
.grouphead {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--serif); font-variant: small-caps; letter-spacing: 2px;
  font-size: 15px; font-weight: 700; color: var(--gold); margin: 16px 0 7px;
}
.grouphead::before { content: "❧"; color: var(--line-strong); font-size: 13px; }
.grouphead::after {
  content: ""; flex: 1; height: 1px;
  background: linear-gradient(to right, var(--line-strong), transparent);
}

/* ============================================================
   MODAL (resolution panel + editors)
   ============================================================ */
.overlay {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(20,15,10,.55);
  display: flex; align-items: flex-end; justify-content: center;
}
@media (min-width: 700px) { .overlay { align-items: center; } }
.modal {
  background: var(--bg); background-image: var(--paper);
  width: 100%; max-width: 640px;
  max-height: 92vh; overflow-y: auto;
  border: 2px solid var(--line-strong); border-bottom: none;
  border-radius: 12px 12px 0 0; padding: 16px 16px 24px;
  box-shadow: inset 0 0 0 1px var(--bg), inset 0 0 0 2px var(--line);
}
@media (min-width: 700px) { .modal { border-radius: 12px; border-bottom: 2px solid var(--line-strong); max-height: 88vh; } }
.modal h2 { font-size: 22px; margin-bottom: 2px; font-variant: small-caps; letter-spacing: 1px; }
.modal .closebar { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
.modal .closebar button { font-size: 22px; color: var(--ink-soft); padding: 0 4px; }
.optrow {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
  margin-bottom: 6px; background: var(--card); cursor: pointer;
}
.optrow input { margin-top: 3px; accent-color: var(--accent); width: 17px; height: 17px; flex: none; }
.optrow .on { font-weight: 700; }
.optrow .od { font-size: 12.5px; color: var(--ink-soft); }
.optrow.disabled { opacity: .5; }
.instructions {
  background: var(--card); border: 1px solid var(--gold); border-radius: var(--radius);
  box-shadow: inset 0 0 0 1px var(--card), inset 0 0 0 2px var(--line), var(--shadow);
  padding: 12px 12px 12px 14px; margin: 10px 0;
  border-left: 4px solid var(--gold);
}
.instructions ol { margin-left: 20px; }
.instructions li { margin: 4px 0; }
.instructions b.hit { color: var(--accent); }
.mmx { display: flex; gap: 8px; margin: 10px 0; }
.mmx .stat { flex: 1; }
.warnbox {
  background: var(--accent-soft); color: var(--accent);
  border-radius: 8px; padding: 8px 12px; margin: 8px 0; font-size: 13.5px; font-weight: 600;
}
.rollout {
  background: var(--bg2); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 12px; margin-top: 8px; font-size: 14px;
}
.rollout .total { font-size: 24px; font-weight: 800; }
.rollout .crit { color: var(--accent); font-weight: 800; }
.die {
  display: inline-block; min-width: 24px; text-align: center; padding: 2px 4px; margin: 1px;
  background: var(--card); border: 1px solid var(--line); border-radius: 5px;
  font-weight: 700; font-size: 13px;
}
.die.max { border-color: var(--good); color: var(--good); }
.die.min { border-color: var(--accent); color: var(--accent); }
.die.dropped { opacity: .4; text-decoration: line-through; }

/* ============================================================
   EDIT VIEW
   ============================================================ */
.subtabs { display: flex; gap: 6px; margin-bottom: 12px; }
.formrow { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
.formrow label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; font-weight: 600; color: var(--ink-soft); }
.formrow input[type=text], .formrow input[type=number] { width: 130px; }
.formrow input.wide, .formrow select.wide { width: 100%; }
.formrow textarea { width: 100%; min-height: 60px; }
.formrow .full { width: 100%; }
.listedit { border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin-bottom: 8px; background: var(--bg2); }
.editrowbtns { display: flex; gap: 6px; justify-content: flex-end; margin-top: 4px; }
fieldset {
  border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 12px;
}
legend { font-variant: small-caps; font-size: 14px; letter-spacing: 1.5px; font-weight: 700; color: var(--gold); padding: 0 6px; }
.hint { font-size: 12px; color: var(--ink-soft); margin-top: 3px; }
code { background: var(--bg2); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 12.5px; }

/* menu dropdown */
#menuPanel {
  position: absolute; right: 10px; top: 46px; z-index: 60;
  background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: 0 4px 16px rgba(0,0,0,.25); overflow: hidden; min-width: 190px;
}
#menuPanel button { display: block; width: 100%; text-align: left; padding: 11px 16px; font-size: 14px; }
#menuPanel button:hover { background: var(--bg2); }
.hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>⚔️ Party Companion</h1>
  <select id="charSelect"></select>
  <button id="menuBtn" title="Menu">☰</button>
  <div id="menuPanel" class="hidden">
    <button data-menu="new">＋ New character</button>
    <button data-menu="duplicate">⧉ Duplicate character</button>
    <button data-menu="export">⬇ Export character</button>
    <button data-menu="exportAll">⬇ Export all</button>
    <button data-menu="import">⬆ Import file</button>
    <button data-menu="delete">✕ Delete character</button>
  </div>
</header>

<nav class="tabs">
  <button data-tab="sheet" class="active"><span class="ico">📜</span>Sheet</button>
  <button data-tab="actions"><span class="ico">⚔️</span>Actions</button>
  <button data-tab="edit"><span class="ico">✎</span>Edit</button>
</nav>

<main>
  <div id="view-sheet"></div>
  <div id="view-actions" class="hidden"></div>
  <div id="view-edit" class="hidden"></div>
</main>

<div id="modalRoot"></div>
<input type="file" id="importFile" accept=".json,application/json" class="hidden">

<script>
"use strict";
/* ============================================================
   SECTION 1: RULES CONSTANTS (from the 2024 Player's Handbook)
   ============================================================ */
const ABILITIES = ["str","dex","con","int","wis","cha"];
const ABILITY_NAMES = { str:"Strength", dex:"Dexterity", con:"Constitution", int:"Intelligence", wis:"Wisdom", cha:"Charisma" };
const DAMAGE_TYPES = ["acid","bludgeoning","cold","fire","force","lightning","necrotic","piercing","poison","psychic","radiant","slashing","thunder","healing"];

// 2024 skill list → governing ability. Character stores skills as {name: 0|1|2}
// (0/absent = untrained, 1 = proficient, 2 = expertise).
const SKILLS = {
  "Acrobatics":"dex", "Animal Handling":"wis", "Arcana":"int", "Athletics":"str",
  "Deception":"cha", "History":"int", "Insight":"wis", "Intimidation":"cha",
  "Investigation":"int", "Medicine":"wis", "Nature":"int", "Perception":"wis",
  "Performance":"cha", "Persuasion":"cha", "Religion":"int",
  "Sleight of Hand":"dex", "Stealth":"dex", "Survival":"wis"
};
const COINS = ["pp","gp","ep","sp","cp"];

/* ============================================================
   SECTION 3: DICE EXPRESSION LANGUAGE
   ------------------------------------------------------------
   Grammar: terms joined by + or -.  Each term is either
     <count>d<size>   e.g. 3d6, Ld6, ceil(L/2)d6
   or a flat value    e.g. 4, L, PB, MOD, DEX
   Symbols resolved against a character context:
     L   = total character level      PB  = proficiency bonus
     MOD = the action's attack/spellcasting ability modifier
     STR DEX CON INT WIS CHA = that ability's modifier
     ceil(X/2) floor(X/2) around any symbol or number
   ============================================================ */
function resolveSymbol(sym, ctx) {
  sym = sym.trim();
  let m;
  if ((m = sym.match(/^(ceil|floor)\(\s*(.+?)\s*\/\s*(\d+)\s*\)$/i))) {
    const inner = resolveSymbol(m[2], ctx);
    if (inner === null) return null;
    const v = inner / parseInt(m[3], 10);
    return m[1].toLowerCase() === "ceil" ? Math.ceil(v) : Math.floor(v);
  }
  if (/^\d+$/.test(sym)) return parseInt(sym, 10);
  const u = sym.toUpperCase();
  if (u === "L") return ctx.level;
  if (u === "PB") return ctx.pb;
  if (u === "MOD") return ctx.mod;
  const ab = u.toLowerCase();
  if (ABILITIES.includes(ab)) return ctx.mods[ab];
  return null; // unknown symbol
}

// Parse "expr" into terms: [{sign, count, size}] (size=0 → flat term of value count)
function parseDice(expr, ctx) {
  const out = { terms: [], errors: [] };
  if (!expr || !expr.trim()) return out;
  // tokenize into signed chunks
  const chunks = expr.replace(/\s+/g, "").replace(/-/g, "+-").split("+").filter(c => c !== "");
  for (let chunk of chunks) {
    let sign = 1;
    if (chunk.startsWith("-")) { sign = -1; chunk = chunk.slice(1); }
    const dm = chunk.match(/^(.*?)[dD](\d+)$/);
    if (dm) {
      const countSym = dm[1] === "" ? "1" : dm[1];
      const count = resolveSymbol(countSym, ctx);
      if (count === null) { out.errors.push(chunk); continue; }
      out.terms.push({ sign, count: Math.max(0, count), size: parseInt(dm[2], 10) });
    } else {
      const v = resolveSymbol(chunk, ctx);
      if (v === null) { out.errors.push(chunk); continue; }
      out.terms.push({ sign, count: v, size: 0 });
    }
  }
  return out;
}

function diceStats(terms, { crit = false } = {}) {
  let min = 0, max = 0, avg = 0;
  for (const t of terms) {
    const mult = t.sign;
    if (t.size === 0) { min += mult * t.count; max += mult * t.count; avg += mult * t.count; }
    else {
      const n = t.count * (crit ? 2 : 1);
      // negative dice (e.g. Cunning Strike forgoing Sneak dice) subtract
      if (mult > 0) { min += n; max += n * t.size; avg += n * (t.size + 1) / 2; }
      else { min -= n * t.size; max -= n; avg -= n * (t.size + 1) / 2; }
    }
  }
  return { min, max, avg: Math.round(avg * 10) / 10 };
}

function fmtTerms(terms, { crit = false } = {}) {
  const parts = [];
  for (const t of terms) {
    let s;
    if (t.size === 0) { if (t.count === 0) continue; s = String(Math.abs(t.count)); }
    else { const n = t.count * (crit ? 2 : 1); if (n === 0) continue; s = n + "d" + t.size; }
    const neg = (t.size === 0 ? t.count * t.sign : t.sign) < 0;
    parts.push((parts.length ? (neg ? " − " : " + ") : (neg ? "−" : "")) + s);
  }
  return parts.join("") || "0";
}

function rollTerms(terms, { crit = false } = {}) {
  let total = 0; const detail = [];
  for (const t of terms) {
    if (t.size === 0) { total += t.sign * t.count; if (t.count !== 0) detail.push({ flat: t.sign * t.count }); }
    else {
      const n = t.count * (crit ? 2 : 1);
      for (let i = 0; i < n; i++) {
        const r = 1 + Math.floor(Math.random() * t.size);
        total += t.sign * r;
        detail.push({ die: t.size, roll: r, sign: t.sign });
      }
    }
  }
  return { total, detail };
}

function rollD20(advState) { // advState: -1 dis, 0 straight, 1 adv
  const a = 1 + Math.floor(Math.random() * 20);
  if (advState === 0) return { rolls: [a], pick: a };
  const b = 1 + Math.floor(Math.random() * 20);
  const pick = advState > 0 ? Math.max(a, b) : Math.min(a, b);
  return { rolls: [a, b], pick };
}

function totalLevel(ch) { return ch.classes.reduce((s, c) => s + (c.level || 0), 0) || 1; }

function casterTypeOf(ch) {
  if (ch.casterType && ch.casterType !== "auto") return ch.casterType;
  // auto: take the "biggest" caster type among classes (single-class assumption)
  let best = "none";
  const rank = { none:0, third:1, pact:2, half:3, full:4 };
  for (const c of ch.classes) {
    const t = CLASSES[c.cls] || "none";
    if (rank[t] > rank[best]) best = t;
  }
  return best;
}

function slotsFor(ch) {
  const t = casterTypeOf(ch);
  if (t === "pact" || t === "none") return [];
  const row = SLOT_TABLES[t] && SLOT_TABLES[t][clamp(totalLevel(ch), 1, 20)];
  return row || [];
}
function pactFor(ch) {
  return casterTypeOf(ch) === "pact" ? PACT_TABLE[clamp(totalLevel(ch), 1, 20)] : null;
}

function contextOf(ch, action) {
  const mods = {};
  for (const a of ABILITIES) mods[a] = mod(ch.abilities[a]);
  const L = totalLevel(ch);
  const pb = profBonus(L);
  let abilityKey = action ? action.ability : "none";
  if (abilityKey === "auto" && action) {
    const tags = action.tags || [];
    if (action.kind === "spell") abilityKey = "spell";
    else if (tags.includes("finesse")) abilityKey = mods.dex >= mods.str ? "dex" : "str";
    else if (tags.includes("ranged")) abilityKey = "dex";
    else abilityKey = "str";
  }
  if (abilityKey === "spell") abilityKey = ch.spellAbility || "int";
  const m = ABILITIES.includes(abilityKey) ? mods[abilityKey] : 0;
  const spellMod = mods[ch.spellAbility || "int"];
  return { level: L, pb, mods, mod: m, abilityKey, spellMod, dc: 8 + pb + spellMod };
}

function skillLevel(ch, name) { return (ch.skills && ch.skills[name]) || 0; }
function skillMod(ch, name) {
  return mod(ch.abilities[SKILLS[name]]) + skillLevel(ch, name) * profBonus(totalLevel(ch));
}
function passivePerception(ch) { return 10 + skillMod(ch, "Perception"); }

      if (DB && Array.isArray(DB.characters) && DB.characters.length) { migrateDB(); return; }
    }
  } catch (e) { console.warn("load failed", e); }
  DB = { version: 1, characters: seedCharacters(), currentId: null, settings: { useResources: false } };
  DB.currentId = DB.characters[0].id;
  saveDB();
}

// Keep older saved data working when the schema grows.
function migrateDB() {
  DB.settings = Object.assign({ useResources: false }, DB.settings || {});
  for (const ch of DB.characters) {
    if (ch.portrait === undefined) ch.portrait = ch.name.startsWith("Sylas") ? SYLAS_PORTRAIT : null;
  }
  if ((DB.version || 1) < 2) { // v2: feat library — give the sample rogue his Sharpshooter
    for (const ch of DB.characters) {
      if (ch.name.startsWith("Sylas") && !ch.options.some(o => o.name.startsWith("Sharpshooter")))
        ch.options.push(featOption("Sharpshooter"));
    }
    DB.version = 2;
  }
  if ((DB.version || 1) < 3) { // v3: skills, equipment, coins
    for (const ch of DB.characters) {
      ch.skills = ch.skills || {};
      ch.equipment = ch.equipment || [];
      ch.coins = ch.coins || { pp:0, gp:0, ep:0, sp:0, cp:0 };
      if (ch.name.startsWith("Sylas") && !Object.keys(ch.skills).length) {
        ch.skills = SAMPLE_KIT.rogue.skills;
        if (!ch.equipment.length) ch.equipment = SAMPLE_KIT.rogue.equipment.map(e => ({ id: uid(), name: e[0], qty: e[1] }));
        if (!COINS.some(c => ch.coins[c])) ch.coins = Object.assign({}, SAMPLE_KIT.rogue.coins);
      }
    }
    DB.version = 3;
  }
  saveDB();
}

// Global party setting: when off, class resources (Ki, Rage, Channel Divinity …)
// are hidden everywhere and never charged — only spell slots are tracked.
function useResources() { return !DB || !DB.settings || DB.settings.useResources === true; }

function currentChar() {
  return DB.characters.find(c => c.id === DB.currentId) || DB.characters[0];
}

function logEvent(ch, msg) {
  ch.state.log.unshift({ t: Date.now(), msg });
  ch.state.log = ch.state.log.slice(0, 25);
}

function weaponAction(libName, overrides) {
  const w = WEAPON_LIBRARY.find(x => x.name === libName);
  return Object.assign({
    id: uid(), name: w.name, kind: "weapon", time: "action",
    ability: "auto", attack: "attack", proficient: true, attackExtra: 0,
    saveAbility: "dex", saveHalf: false,
    damage: [{ expr: w.dmg, type: w.type }],
    spellLevel: null, upcast: null, count: 1, countLabel: "", countScale: "none",
    damageScale: "none", concentration: false, oncePerTurn: false, setFlags: [], costs: [],
    tags: w.tags.slice(),
    description: `${w.cat}. ${w.props}. Mastery: ${w.mastery}.`,
    procedure: `Mastery (${w.mastery}): ${MASTERY_DESCRIPTIONS[w.mastery]}`
  }, overrides || {});
}

function spellAction(o) {
  return Object.assign({
    id: uid(), kind: "spell", time: "action", ability: "spell",
    attack: "none", proficient: true, attackExtra: 0,
    saveAbility: "dex", saveHalf: true,
    damage: [], spellLevel: 1, upcast: null,
    count: 1, countLabel: "", countScale: "none", damageScale: "none",
    concentration: false, oncePerTurn: false, setFlags: [], costs: [],
    tags: ["spell"], description: "", procedure: ""
  }, o);
}

function featureAction(o) {
  return Object.assign({
    id: uid(), kind: "feature", time: "action", ability: "none",
    attack: "none", proficient: true, attackExtra: 0,
    saveAbility: "dex", saveHalf: false,
    damage: [], spellLevel: null, upcast: null,
    count: 1, countLabel: "", countScale: "none", damageScale: "none",
    concentration: false, oncePerTurn: false, setFlags: [], costs: [],
    tags: [], description: "", procedure: ""
  }, o);
}

function makeOption(o) {
  return Object.assign({
    id: uid(), name: "", description: "",
    applies: { mode: "all", tags: [], actionIds: [] },
    requires: "any", defaultOn: false,
    effects: {
      dice: [], advantage: false, disadvantage: false, autoCrit: false,
      slotCost: 0, upcast: null, resourceCosts: [],
      time: null, speedZero: false, oncePerTurn: false, setFlags: [], note: ""
    }
  }, o, { effects: Object.assign({
      dice: [], advantage: false, disadvantage: false, autoCrit: false,
      slotCost: 0, upcast: null, resourceCosts: [],
      time: null, speedZero: false, oncePerTurn: false, setFlags: [], note: ""
    }, o.effects || {}) });
}

function applyKit(ch, kit) {
  ch.skills = Object.assign({}, kit.skills);
  ch.equipment = kit.equipment.map(e => ({ id: uid(), name: e[0], qty: e[1] }));
  ch.coins = Object.assign({}, kit.coins);
}

// Instantiate a feat from FEAT_LIBRARY as a regular (editable) Option.
function featOption(name, overrides) {
  const f = FEAT_LIBRARY.find(x => x.name === name || x.name.startsWith(name));
  return makeOption(Object.assign(JSON.parse(JSON.stringify(f)), overrides || {}));
}

function seedCharacters() { return [seedRogue(), seedCleric(), seedWizard(), seedPaladin()]; }
/* ============================================================
   SECTION 6: RULES ENGINE — resolution, costs, commit, rests
   ============================================================ */
function noteTokens(text, ctx) {
  return String(text || "")
    .replace(/\{DC-(STR|DEX|CON|INT|WIS|CHA)\}/gi, (_, ab) => 8 + ctx.pb + ctx.mods[ab.toLowerCase()])
    .replace(/\{DC\}/g, ctx.dc)
    .replace(/\{PB\}/g, ctx.pb)
    .replace(/\{MOD\}/g, fmtMod(ctx.mod))
    .replace(/\{L\}/g, ctx.level)
    .replace(/\{(STR|DEX|CON|INT|WIS|CHA)\}/gi, (_, ab) => fmtMod(ctx.mods[ab.toLowerCase()]));
}

function optionApplies(opt, action) {
  const a = opt.applies || { mode: "all" };
  if (opt.requires === "attack" && action.attack !== "attack") return false;
  if (a.mode === "all") return true;
  if (a.mode === "tags") return (action.tags || []).some(t => (a.tags || []).includes(t));
  if (a.mode === "actions") return (a.actionIds || []).includes(action.id);
  return false;
}

function cantripTier(level) { return 1 + (level >= 5 ? 1 : 0) + (level >= 11 ? 1 : 0) + (level >= 17 ? 1 : 0); }

function scaleTerms(terms, mult) {
  return terms.map(t => t.size === 0 ? t : Object.assign({}, t, { count: t.count * mult }));
}

// Which slot levels can the character still consider (for pickers)? Returns [{lvl, free, max}]
function slotLevels(ch) {
  const out = [];
  const pact = pactFor(ch);
  if (pact) {
    out.push({ lvl: pact.lvl, free: pact.n - ch.state.pactUsed, max: pact.n, pact: true });
    return out;
  }
  const slots = slotsFor(ch);
  for (let i = 0; i < slots.length; i++) {
    if (slots[i] > 0) out.push({ lvl: i + 1, free: slots[i] - (ch.state.slotsUsed[i] || 0), max: slots[i], pact: false });
  }
  return out;
}

/**
 * Resolve an action + selected options into instructions, dice and costs.
 * sel = { opts: Set<optionId>, slotLevel: int|null, optSlots: {optionId: int} }
 */
function resolveSelection(ch, action, sel) {
  const ctx = contextOf(ch, action);
  const r = {
    ctx, advCount: 0, disCount: 0, autoCrit: false,
    attackBonus: null, save: null,
    damage: [],           // [{type, terms}]
    healing: null,        // {terms}
    count: action.count || 1, countLabel: action.countLabel || "",
    costs: [], warnings: [], notes: [], steps: [], errors: []
  };
  const isPact = !!pactFor(ch);
  const baseType = (action.damage[0] && action.damage[0].type) || "damage";

  const addDice = (expr, type) => {
    const parsed = parseDice(expr, ctx);
    parsed.errors.forEach(e => r.errors.push(e));
    if (!parsed.terms.length) return;
    const ty = type || baseType;
    if (ty === "healing") {
      if (!r.healing) r.healing = { terms: [] };
      r.healing.terms.push(...parsed.terms);
      return;
    }
    let group = r.damage.find(g => g.type === ty);
    if (!group) { group = { type: ty, terms: [] }; r.damage.push(group); }
    group.terms.push(...parsed.terms);
  };

  // --- base damage (with cantrip scaling) ---
  const tier = cantripTier(ctx.level);
  for (const d of action.damage) {
    const parsed = parseDice(d.expr, ctx);
    parsed.errors.forEach(e => r.errors.push(e));
    let terms = parsed.terms;
    if (action.damageScale === "cantrip" && tier > 1) terms = scaleTerms(terms, tier);
    const ty = d.type || "damage";
    if (ty === "healing") {
      if (!r.healing) r.healing = { terms: [] };
      r.healing.terms.push(...terms);
    } else {
      let group = r.damage.find(g => g.type === ty);
      if (!group) { group = { type: ty, terms: [] }; r.damage.push(group); }
      group.terms.push(...terms);
    }
  }
  if (action.countScale === "cantrip") r.count = tier;

  // --- action's own casting cost / economy ---
  if (action.time && action.time !== "none") r.costs.push({ kind: "econ", time: action.time, label: cap(action.time) });

  // --- spell slot + upcast for leveled spells ---
  if (action.kind === "spell" && action.spellLevel >= 1) {
    const lvl = sel.slotLevel || action.spellLevel;
    r.costs.push({ kind: isPact ? "pact" : "slot", level: lvl, label: `Level ${lvl} spell slot${isPact ? " (Pact)" : ""}` });
    const above = lvl - action.spellLevel;
    if (above > 0 && action.upcast) {
      if (action.upcast.mode === "dice") {
        const parsed = parseDice(action.upcast.expr, ctx);
        addDiceTerms(r, scaleTerms(parsed.terms, above), action.upcast.type || baseType);
      } else if (action.upcast.mode === "count") {
        r.count += above;
      }
    }
    const avail = slotLevels(ch).find(s => s.lvl === lvl);
    if (!avail || avail.free <= 0) r.warnings.push(`No level ${lvl} slot left!`);
  }

  // helper used above (defined late but hoisted as function declaration below)
  function addDiceTerms(res, terms, type) {
    if (type === "healing") {
      if (!res.healing) res.healing = { terms: [] };
      res.healing.terms.push(...terms); return;
    }
    let group = res.damage.find(g => g.type === type);
    if (!group) { group = { type, terms: [] }; res.damage.push(group); }
    group.terms.push(...terms);
  }

  // --- attack / save ---
  if (action.attack === "attack") {
    r.attackBonus = ctx.mod + (action.proficient ? ctx.pb : 0) + (action.attackExtra || 0);
  } else if (action.attack === "save") {
    r.save = { ability: action.saveAbility, dc: ctx.dc, half: action.saveHalf };
  }

  // --- resource costs on the action itself ---
  for (const c of (useResources() ? action.costs || [] : [])) {
    if (c.type === "resource") {
      const res = ch.resources.find(x => x.id === c.id);
      if (res) {
        r.costs.push({ kind: "resource", id: res.id, amount: c.amount || 1, label: `${c.amount || 1} × ${res.name}` });
        const used = ch.state.res[res.id] || 0;
        if (used + (c.amount || 1) > res.max) r.warnings.push(`Not enough ${res.name} left!`);
      }
    }
  }
  if (action.oncePerTurn) {
    r.costs.push({ kind: "perTurn", id: action.id, label: "Once per turn" });
    if (ch.state.perTurnUsed[action.id]) r.warnings.push(`${action.name} was already used this turn.`);
  }
  for (const f of (action.setFlags || [])) r.costs.push({ kind: "flag", flag: f, label: f.label });
  if (action.concentration) {
    const conc = ch.state.flags.find(f => /^Concentration/i.test(f.label));
    if (conc) r.warnings.push(`Already concentrating (${conc.label.replace(/^Concentration:\s*/i, "")}) — casting this ends it.`);
    if (!(action.setFlags || []).some(f => /^Concentration/i.test(f.label)))
      r.costs.push({ kind: "flag", flag: { label: `Concentration: ${action.name}`, clear: "manual" }, label: `Concentration: ${action.name}` });
  }

  // --- selected options ---
  for (const opt of ch.options) {
    if (!sel.opts.has(opt.id)) continue;
    const fx = opt.effects;
    if (fx.advantage) r.advCount++;
    if (fx.disadvantage) r.disCount++;
    if (fx.autoCrit) r.autoCrit = true;
    for (const d of (fx.dice || [])) addDice(d.expr, d.type || "");
    if (fx.slotCost > 0) {
      const lvl = (sel.optSlots && sel.optSlots[opt.id]) || fx.slotCost;
      r.costs.push({ kind: isPact ? "pact" : "slot", level: lvl, label: `Level ${lvl} spell slot (${opt.name})` });
      const above = lvl - fx.slotCost;
      if (above > 0 && fx.upcast) {
        const parsed = parseDice(fx.upcast.expr, ctx);
        addDiceTerms(r, scaleTerms(parsed.terms, above), fx.upcast.type || baseType);
      }
      const avail = slotLevels(ch).find(s => s.lvl === lvl);
      if (!avail || avail.free <= 0) r.warnings.push(`No level ${lvl} slot left for ${opt.name}!`);
    }
    for (const c of (useResources() ? fx.resourceCosts || [] : [])) {
      const res = ch.resources.find(x => x.id === c.id);
      if (res) {
        r.costs.push({ kind: "resource", id: res.id, amount: c.amount || 1, label: `${c.amount || 1} × ${res.name} (${opt.name})` });
        const used = ch.state.res[res.id] || 0;
        if (used + (c.amount || 1) > res.max) r.warnings.push(`Not enough ${res.name} left!`);
      }
    }
    if (fx.time) r.costs.push({ kind: "econ", time: fx.time, label: `${cap(fx.time)} (${opt.name})` });
    if (fx.speedZero) r.costs.push({ kind: "speedZero", label: "Speed becomes 0" });
    for (const f of (fx.setFlags || [])) r.costs.push({ kind: "flag", flag: f, label: f.label });
    if (fx.oncePerTurn) {
      r.costs.push({ kind: "perTurn", id: opt.id, label: `Once per turn (${opt.name})` });
      if (ch.state.perTurnUsed[opt.id]) r.warnings.push(`${opt.name} was already used this turn.`);
    }
    if (fx.note) r.notes.push(`<b>${esc(opt.name)}:</b> ${esc(noteTokens(fx.note, ctx))}`);
  }

  // --- economy warnings ---
  const econNeeded = { action: 0, bonus: 0, reaction: 0 };
  for (const c of r.costs) if (c.kind === "econ") econNeeded[c.time]++;
  for (const t of ["action", "bonus", "reaction"]) {
    if (econNeeded[t] > 0 && ch.state.econ[t]) r.warnings.push(`${cap(t)} already used this turn.`);
    if (econNeeded[t] > 1) r.warnings.push(`This combination needs ${econNeeded[t]} × ${cap(t)} — not possible in one turn.`);
  }
  if (r.errors.length) r.warnings.push(`Unknown dice symbols: ${r.errors.join(", ")}`);

  // --- advantage state ---
  r.advState = r.advCount > 0 && r.disCount > 0 ? 0 : (r.advCount > 0 ? 1 : (r.disCount > 0 ? -1 : 0));

  // --- stats over all damage (not healing) ---
  const allTerms = r.damage.flatMap(g => g.terms);
  r.stats = diceStats(allTerms);
  r.statsPerHit = r.stats;
  if (r.count > 1) r.stats = { min: r.stats.min * r.count, max: r.stats.max * r.count, avg: Math.round(r.stats.avg * r.count * 10) / 10 };
  r.healStats = r.healing ? diceStats(r.healing.terms) : null;

  // --- instruction steps ---
  const stepCost = r.costs.filter(c => c.kind !== "flag" && c.kind !== "perTurn").map(c => c.label);
  if (stepCost.length) r.steps.push(`<b>Cost:</b> ${stepCost.map(esc).join(" · ")}`);
  const one = (r.countLabel || "hit").replace(/s$/i, ""); // "darts" → "per dart"
  const perLabel = r.count > 1 ? ` <i>per ${esc(one)}</i>` : "";
  if (r.attackBonus !== null) {
    const advTxt = r.advState > 0 ? " with <b>Advantage</b> (roll 2d20, keep highest)"
                 : r.advState < 0 ? " with <b>Disadvantage</b> (roll 2d20, keep lowest)" : "";
    const times = r.count > 1 ? ` — one attack roll per ${esc(r.countLabel ? one : "attack")} (${r.count}×)` : "";
    r.steps.push(`<b>To hit:</b> roll <b>1d20 ${fmtMod(r.attackBonus)}</b>${advTxt}${times}.`);
  }
  if (r.save) {
    const abName = ABILITY_NAMES[r.save.ability] || r.save.ability;
    const art = /^[aeiou]/i.test(abName) ? "an" : "a";
    r.steps.push(`<b>Save:</b> target makes ${art} <b>${esc(abName)} save</b> vs. <b>DC ${r.save.dc}</b> — fail: full effect${r.save.half ? ", success: half damage" : ", success: no effect"}.`);
  }
  if (r.damage.length) {
    const dmgTxt = r.damage.map(g => `<b>${fmtTerms(g.terms)}</b> ${esc(g.type)}`).join(" + ");
    const lead = r.attackBonus !== null ? "On a hit" : (r.save ? "Damage" : "Damage");
    r.steps.push(`<b class="hit">${lead}:</b> ${dmgTxt}${perLabel}${r.count > 1 ? ` (${r.count} ${esc(r.countLabel || "hits")})` : ""}.`);
    if (r.attackBonus !== null) {
      r.steps.push(r.autoCrit
        ? `<b>Critical:</b> automatic crit — roll all damage dice <b>twice</b>: ${r.damage.map(g => `<b>${fmtTerms(g.terms, { crit: true })}</b> ${esc(g.type)}`).join(" + ")}.`
        : `<b>On a crit (nat 20):</b> roll all damage dice twice: ${r.damage.map(g => `<b>${fmtTerms(g.terms, { crit: true })}</b> ${esc(g.type)}`).join(" + ")}.`);
    }
  }
  if (r.healing) r.steps.push(`<b>Healing:</b> restore <b>${fmtTerms(r.healing.terms)}</b> HP.`);
  if (action.procedure) r.notes.unshift(esc(noteTokens(action.procedure, ctx)));
  return r;
}

function commitSelection(ch, action, sel, r) {
  const parts = [];
  for (const c of r.costs) {
    if (c.kind === "slot") { ch.state.slotsUsed[c.level - 1] = (ch.state.slotsUsed[c.level - 1] || 0) + 1; parts.push(`L${c.level} slot`); }
    else if (c.kind === "pact") { ch.state.pactUsed++; parts.push("pact slot"); }
    else if (c.kind === "resource") { ch.state.res[c.id] = (ch.state.res[c.id] || 0) + c.amount; const res = ch.resources.find(x => x.id === c.id); parts.push(`${c.amount} ${res ? res.name : "resource"}`); }
    else if (c.kind === "econ") { ch.state.econ[c.time] = true; }
    else if (c.kind === "speedZero") {
      if (!ch.state.flags.some(f => f.label.startsWith("Speed 0"))) ch.state.flags.push({ id: uid(), label: "Speed 0 (Steady Aim)", clear: "turn" });
    }
    else if (c.kind === "flag") {
      if (!ch.state.flags.some(f => f.label === c.flag.label)) ch.state.flags.push({ id: uid(), label: c.flag.label, clear: c.flag.clear || "manual" });
    }
    else if (c.kind === "perTurn") { ch.state.perTurnUsed[c.id] = true; }
  }
  const optNames = ch.options.filter(o => sel.opts.has(o.id)).map(o => o.name);
  logEvent(ch, `${action.name}${optNames.length ? " + " + optNames.join(", ") : ""}${parts.length ? ` (spent: ${parts.join(", ")})` : ""}`);
  saveDB();
}

function newTurn(ch) {
  ch.state.econ = { action:false, bonus:false, reaction:false };
  ch.state.perTurnUsed = {};
  ch.state.flags = ch.state.flags.filter(f => f.clear !== "turn");
  logEvent(ch, "— New turn —");
  saveDB();
}
function newEncounter(ch) {
  newTurn(ch);
  ch.state.flags = ch.state.flags.filter(f => f.clear !== "encounter");
  logEvent(ch, "— New encounter —");
  saveDB();
}
function shortRest(ch) {
  ch.state.pactUsed = 0;
  for (const res of ch.resources) if (res.reset === "short") ch.state.res[res.id] = 0;
  ch.state.flags = ch.state.flags.filter(f => f.clear !== "rest" && f.clear !== "turn" && f.clear !== "encounter");
  ch.state.econ = { action:false, bonus:false, reaction:false };
  ch.state.perTurnUsed = {};
  logEvent(ch, "— Short rest: short-rest resources & pact slots restored —");
  saveDB();
}
function longRest(ch) {
  ch.state.hp = ch.maxHp; ch.state.tempHp = 0;
  ch.state.slotsUsed = [0,0,0,0,0,0,0,0,0]; ch.state.pactUsed = 0;
  for (const res of ch.resources) ch.state.res[res.id] = 0;
  ch.state.hitDiceUsed = Math.max(0, ch.state.hitDiceUsed - Math.max(1, Math.floor(totalLevel(ch) / 2)));
  ch.state.flags = ch.state.flags.filter(f => f.clear === "manual" && !/^Concentration/i.test(f.label));
  ch.state.econ = { action:false, bonus:false, reaction:false };
  ch.state.perTurnUsed = {};
  logEvent(ch, "— Long rest: HP, slots & resources restored —");
  saveDB();
}
/* ============================================================
   SECTION 7: UI
   ============================================================ */
const UI = { tab: "sheet", search: "", filter: "all", editTab: "character", modal: null };

function render() {
  // header character select
  $("#charSelect").innerHTML = DB.characters.map(c =>
    `<option value="${c.id}" ${c.id === DB.currentId ? "selected" : ""}>${esc(c.name)}</option>`).join("");
  $$("nav.tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === UI.tab));
  $("#view-sheet").classList.toggle("hidden", UI.tab !== "sheet");
  $("#view-actions").classList.toggle("hidden", UI.tab !== "actions");
  $("#view-edit").classList.toggle("hidden", UI.tab !== "edit");
  if (UI.tab === "sheet") renderSheet();
  if (UI.tab === "actions") renderActions();
  if (UI.tab === "edit") renderEdit();
}

/* ---------------- SHEET ---------------- */
function pipsHtml(max, used, cb) {
  let h = `<span class="pips">`;
  const filled = max - used;
  for (let i = 0; i < max; i++)
    h += `<button class="pip ${i < filled ? "" : "empty"}" onclick="${cb}(${i})" title="${i < filled ? "spend" : "restore"}"></button>`;
  return h + `</span>`;
}

function renderSheet() {
  const ch = currentChar();
  const ctx = contextOf(ch, null);
  const speedZero = ch.state.flags.some(f => f.label.startsWith("Speed 0"));
  const clsLine = ch.classes.map(c => `${c.cls}${c.subclass ? " (" + c.subclass + ")" : ""} ${c.level}`).join(" / ");
  const hpPct = clamp(ch.state.hp / Math.max(1, ch.maxHp) * 100, 0, 100);
  const hpCls = hpPct <= 25 ? "crit" : hpPct <= 50 ? "low" : "";
  const slots = slotsFor(ch);
  const pact = pactFor(ch);

  let slotHtml = "";
  if (slots.some(n => n > 0)) {
    slotHtml = slots.map((n, i) => n > 0 ? `<div class="slotrow"><span class="lvl">L${i + 1}</span>${pipsHtml(n, ch.state.slotsUsed[i] || 0, `toggleSlot.bind(null,${i})`)}</div>` : "").join("");
  } else if (pact) {
    slotHtml = `<div class="slotrow"><span class="lvl">L${pact.lvl}</span>${pipsHtml(pact.n, ch.state.pactUsed, "togglePact.bind(null)")} <span class="muted">Pact Magic (short rest)</span></div>`;
  }

  const resHtml = ch.resources.map(res => {
    const used = ch.state.res[res.id] || 0;
    const inner = res.style === "counter"
      ? `<span class="stepper"><button onclick="adjustRes('${res.id}',1)">−</button></span>
         <b style="min-width:70px;text-align:center">${res.max - used} / ${res.max}</b>
         <span class="stepper"><button onclick="adjustRes('${res.id}',-1)">+</button></span>`
      : pipsHtml(res.max, used, `toggleRes.bind(null,'${res.id}')`);
    return `<div class="slotrow"><span style="min-width:150px;font-weight:600">${esc(res.name)}</span> ${inner}
      <span class="muted">(${res.reset} rest)</span></div>`;
  }).join("") || `<span class="muted">No resources — add some in Edit.</span>`;

  const flagsHtml = ch.state.flags.map(f =>
    `<span class="flag">${esc(f.label)} <button onclick="removeFlag('${f.id}')" title="remove">×</button></span>`).join("")
    || `<span class="muted">No active effects.</span>`;

  const logHtml = ch.state.log.map(l => `<div>${esc(l.msg)}</div>`).join("") || `<span class="muted">Nothing yet — use an action!</span>`;

  $("#view-sheet").innerHTML = `
    <div class="card namecard">
      ${ch.portrait ? `<img class="portrait" src="${ch.portrait}" alt="Portrait of ${esc(ch.name)}">` : `<div class="portrait placeholder">⚔️</div>`}
      <div style="flex:1;min-width:140px">
        <b class="charname">${esc(ch.name)}</b>
        <div class="muted">${esc(clsLine)} · Level ${totalLevel(ch)}</div>
      </div>
      <div class="muted" style="text-align:right">Spell DC <b>${ctx.dc}</b><br>Spell atk <b>${fmtMod(ctx.spellMod + ctx.pb)}</b></div>
    </div>

    <div class="statrow">
      <div class="stat"><div class="v">${ch.ac}</div><div class="l">AC</div></div>
      <div class="stat"><div class="v">${fmtMod(ctx.mods.dex + (ch.initExtra || 0))}</div><div class="l">Initiative</div></div>
      <div class="stat"><div class="v ${speedZero ? "zeroed" : ""}">${speedZero ? 0 : ch.speed}</div><div class="l">Speed</div></div>
      <div class="stat"><div class="v">${fmtMod(ctx.pb)}</div><div class="l">Prof.</div></div>
      <div class="stat"><div class="v">${passivePerception(ch)}</div><div class="l">Pass. Perc.</div></div>
    </div>

    <div class="abilities">${ABILITIES.map(a => `
      <div class="ab"><div class="name">${a.toUpperCase()}</div><div class="mod">${fmtMod(ctx.mods[a])}</div><div class="score">${ch.abilities[a]}</div></div>`).join("")}
    </div>

    <div class="card">
      <h3>Skills</h3>
      <div class="skills">${Object.keys(SKILLS).map(name => {
        const lv = skillLevel(ch, name);
        return `<div class="skill ${lv ? "trained" : ""}"><span class="dot l${lv}">${lv === 2 ? "★" : lv === 1 ? "●" : "○"}</span><span class="sn">${esc(name)}</span><b>${fmtMod(skillMod(ch, name))}</b></div>`;
      }).join("")}</div>
      <div class="hint" style="margin-top:6px">● proficient · ★ expertise — set in Edit → Character</div>
    </div>

    <div class="card">
      <h3>Hit Points</h3>
      <div class="hpctl">
        <span class="bignum">${ch.state.hp} / ${ch.maxHp}</span>
        <span class="stepper">
          <button onclick="adjustHp(-5)">−5</button><button onclick="adjustHp(-1)">−1</button>
          <button onclick="adjustHp(1)">+1</button><button onclick="adjustHp(5)">+5</button>
        </span>
        <label class="muted">Temp <input type="number" style="width:60px" value="${ch.state.tempHp}" onchange="setTempHp(this.value)"></label>
      </div>
      <div class="hpbar"><div class="${hpCls}" style="width:${hpPct}%"></div></div>
      <div class="muted">Hit dice (${esc(ch.hitDie)}): ${totalLevel(ch) - ch.state.hitDiceUsed} / ${totalLevel(ch)} left
        <span class="stepper"><button onclick="adjustHitDice(1)" title="spend">−</button><button onclick="adjustHitDice(-1)" title="restore">+</button></span>
      </div>
    </div>

    ${slotHtml ? `<div class="card"><h3>Spell Slots</h3>${slotHtml}</div>` : ""}

    ${useResources() ? `<div class="card"><h3>Resources</h3>${resHtml}</div>` : ""}

    <div class="card">
      <h3>This Turn</h3>
      <div class="economy">
        ${["action","bonus","reaction"].map(t => `<button class="econ ${ch.state.econ[t] ? "used" : ""}" onclick="toggleEcon('${t}')">${cap(t)}</button>`).join("")}
      </div>
      <div style="margin-bottom:10px">${flagsHtml}</div>
      <div class="btnrow">
        <button class="btn primary" onclick="doNewTurn()">▶ New turn</button>
        <button class="btn" onclick="doNewEncounter()">⚔ New encounter</button>
        <button class="btn" onclick="doShortRest()">☕ Short rest</button>
        <button class="btn" onclick="doLongRest()">🌙 Long rest</button>
      </div>
    </div>

    <div class="card">
      <h3>Equipment &amp; Coin</h3>
      ${ch.equipment.map((e, i) => `<div class="equiprow">
        <span class="eqname">${esc(e.name)}</span>
        <span class="stepper"><button onclick="updEquipQty(${i},-1)">−</button></span>
        <b class="eqqty">${e.qty}</b>
        <span class="stepper"><button onclick="updEquipQty(${i},1)">+</button></span>
        <button class="eqdel" onclick="removeEquip(${i})" title="remove">×</button>
      </div>`).join("") || `<div class="muted">No equipment noted yet.</div>`}
      <div style="display:flex;gap:6px;margin-top:8px">
        <input type="text" id="newEquip" placeholder="Add item (e.g. Thieves' Tools)…" style="flex:1"
          onkeydown="if(event.key==='Enter')addEquip()">
        <button class="btn small" onclick="addEquip()">＋ Add</button>
      </div>
      <div class="coinrow">
        ${COINS.map(c => `<label class="coin">${c.toUpperCase()}<input type="number" min="0" value="${ch.coins[c] || 0}" onchange="updCoin('${c}',this.value)"></label>`).join("")}
      </div>
    </div>

    <div class="card">
      <div style="display:flex;align-items:center;gap:8px">
        <h3 style="flex:1;margin-bottom:0">Log</h3>
        <button class="btn small" onclick="clearLog()">✕ Clear</button>
      </div>
      <div id="log">${logHtml}</div>
    </div>`;
}

// equipment & coin
function updEquipQty(i, d) { const e = currentChar().equipment[i]; e.qty = Math.max(0, (e.qty || 0) + d); saveDB(); renderSheet(); }
function removeEquip(i) { currentChar().equipment.splice(i, 1); saveDB(); renderSheet(); }
function addEquip() {
  const inp = $("#newEquip"); const name = (inp.value || "").trim();
  if (!name) return;
  currentChar().equipment.push({ id: uid(), name, qty: 1 });
  saveDB(); renderSheet();
}
function updCoin(c, v) { currentChar().coins[c] = Math.max(0, parseInt(v, 10) || 0); saveDB(); renderSheet(); }
function clearLog() { currentChar().state.log = []; saveDB(); renderSheet(); }

// sheet interactions
function adjustHp(d) {
  const ch = currentChar();
  if (d < 0 && ch.state.tempHp > 0) { // damage eats temp HP first
    const absorb = Math.min(ch.state.tempHp, -d);
    ch.state.tempHp -= absorb; d += absorb;
  }
  ch.state.hp = clamp(ch.state.hp + d, 0, ch.maxHp);
  saveDB(); renderSheet();
}
function setTempHp(v) { currentChar().state.tempHp = Math.max(0, parseInt(v, 10) || 0); saveDB(); renderSheet(); }
function adjustHitDice(d) { const ch = currentChar(); ch.state.hitDiceUsed = clamp(ch.state.hitDiceUsed + d, 0, totalLevel(ch)); saveDB(); renderSheet(); }
function toggleSlot(lvlIdx, pipIdx) {
  const ch = currentChar(); const max = slotsFor(ch)[lvlIdx]; const used = ch.state.slotsUsed[lvlIdx] || 0;
  ch.state.slotsUsed[lvlIdx] = pipIdx < max - used ? used + 1 : used - 1;
  saveDB(); renderSheet();
}
function togglePact(pipIdx) {
  const ch = currentChar(); const pact = pactFor(ch);
  ch.state.pactUsed = pipIdx < pact.n - ch.state.pactUsed ? ch.state.pactUsed + 1 : ch.state.pactUsed - 1;
  saveDB(); renderSheet();
}
function toggleRes(id, pipIdx) {
  const ch = currentChar(); const res = ch.resources.find(r => r.id === id); const used = ch.state.res[id] || 0;
  ch.state.res[id] = pipIdx < res.max - used ? used + 1 : used - 1;
  saveDB(); renderSheet();
}
function adjustRes(id, d) {
  const ch = currentChar(); const res = ch.resources.find(r => r.id === id);
  ch.state.res[id] = clamp((ch.state.res[id] || 0) + d, 0, res.max);
  saveDB(); renderSheet();
}
function removeFlag(id) { const ch = currentChar(); ch.state.flags = ch.state.flags.filter(f => f.id !== id); saveDB(); renderSheet(); }
function toggleEcon(t) { const ch = currentChar(); ch.state.econ[t] = !ch.state.econ[t]; saveDB(); renderSheet(); }
function doNewTurn() { newTurn(currentChar()); renderSheet(); }
function doNewEncounter() { newEncounter(currentChar()); renderSheet(); }
function doShortRest() { shortRest(currentChar()); renderSheet(); }
function doLongRest() { longRest(currentChar()); renderSheet(); }

/* ---------------- ACTIONS LIST ---------------- */
function actionDamageSummary(ch, action) {
  const r = resolveSelection(ch, action, { opts: new Set(), slotLevel: action.spellLevel || null, optSlots: {} });
  if (r.healing && !r.damage.length) return { main: `${r.healStats.min}–${r.healStats.max}`, sub: "healing" };
  if (!r.damage.length) return { main: "—", sub: "" };
  return { main: `${r.stats.min}–${r.stats.max}`, sub: `⌀ ${r.stats.avg} ${r.damage.map(g => g.type).join("/")}` };
}

function renderActions() {
  const ch = currentChar();
  const q = UI.search.toLowerCase();
  const match = a => (UI.filter === "all" || a.kind === UI.filter) &&
    (!q || a.name.toLowerCase().includes(q) || (a.description || "").toLowerCase().includes(q));
  const groups = [
    { label: "Weapons & Attacks", items: ch.actions.filter(a => a.kind === "weapon" && match(a)) },
    { label: "Cantrips", items: ch.actions.filter(a => a.kind === "spell" && a.spellLevel === 0 && match(a)) },
  ];
  for (let l = 1; l <= 9; l++) {
    const items = ch.actions.filter(a => a.kind === "spell" && a.spellLevel === l && match(a));
    if (items.length) groups.push({ label: `Level ${l} Spells`, items });
  }
  groups.push({ label: "Features", items: ch.actions.filter(a => a.kind === "feature" && match(a)) });

  const itemHtml = a => {
    const d = actionDamageSummary(ch, a);
    return `<div class="actionitem" onclick="openAction('${a.id}')">
      <div class="info">
        <div class="nm">${esc(a.name)} <span class="pill ${esc(a.time)}">${cap(a.time || "")}</span>${a.concentration ? ` <span class="pill">Conc.</span>` : ""}</div>
        <div class="desc">${esc(a.description || "")}</div>
      </div>
      <div class="dmg">${d.main}<span class="sub">${esc(d.sub)}</span></div>
    </div>`;
  };

  $("#view-actions").innerHTML = `
    <div class="filterbar">
      <input type="search" placeholder="Search…" value="${esc(UI.search)}" oninput="UI.search=this.value;renderActions()">
      ${["all","weapon","spell","feature"].map(f =>
        `<button class="chip ${UI.filter === f ? "active" : ""}" onclick="UI.filter='${f}';renderActions()">${cap(f === "all" ? "all" : f + "s")}</button>`).join("")}
    </div>
    ${groups.filter(g => g.items.length).map(g => `<div class="grouphead">${esc(g.label)}</div>${g.items.map(itemHtml).join("")}`).join("")
      || `<div class="card muted">No actions found. Add some in the Edit tab.</div>`}`;
}

/* ---------------- RESOLUTION MODAL ---------------- */
function openAction(id) {
  const ch = currentChar();
  const action = ch.actions.find(a => a.id === id);
  const sel = { opts: new Set(), slotLevel: action.spellLevel || null, optSlots: {} };
  // pre-check default-on options
  for (const o of ch.options) if (o.defaultOn && optionApplies(o, action)) sel.opts.add(o.id);
  UI.modal = { actionId: id, sel, attackRoll: null, damageRoll: null, healRoll: null, forceCrit: false };
  renderActionModal();
}

function closeModal() { UI.modal = null; $("#modalRoot").innerHTML = ""; }

function renderActionModal() {
  const ch = currentChar();
  const m = UI.modal;
  const action = ch.actions.find(a => a.id === m.actionId);
  if (!action) return closeModal();
  const r = resolveSelection(ch, action, m.sel);
  const opts = ch.options.filter(o => optionApplies(o, action));
  const levels = slotLevels(ch);

  // slot picker for leveled spells
  let slotPick = "";
  if (action.kind === "spell" && action.spellLevel >= 1) {
    const choices = levels.filter(s => s.lvl >= action.spellLevel);
    slotPick = `<div style="margin:8px 0"><b>Cast with slot:</b>
      <select onchange="UI.modal.sel.slotLevel=parseInt(this.value);UI.modal.damageRoll=null;renderActionModal()">
        ${choices.map(s => `<option value="${s.lvl}" ${s.lvl === m.sel.slotLevel ? "selected" : ""}>Level ${s.lvl} (${s.free}/${s.max} left)</option>`).join("")}
      </select></div>`;
    if (!choices.length) slotPick = `<div class="warnbox">No spell slots of level ${action.spellLevel}+ available.</div>`;
  }

  const optHtml = opts.map(o => {
    const on = m.sel.opts.has(o.id);
    let slotSel = "";
    if (on && o.effects.slotCost > 0) {
      const choices = levels.filter(s => s.lvl >= o.effects.slotCost);
      const cur = m.sel.optSlots[o.id] || o.effects.slotCost;
      slotSel = `<div>Slot: <select onclick="event.stopPropagation()" onchange="UI.modal.sel.optSlots['${o.id}']=parseInt(this.value);UI.modal.damageRoll=null;renderActionModal()">
        ${choices.map(s => `<option value="${s.lvl}" ${s.lvl === cur ? "selected" : ""}>Level ${s.lvl} (${s.free}/${s.max} left)</option>`).join("")}
      </select></div>`;
    }
    return `<label class="optrow"><input type="checkbox" ${on ? "checked" : ""} onchange="toggleOpt('${o.id}')">
      <span><span class="on">${esc(o.name)}</span><div class="od">${esc(o.description)}</div>${slotSel}</span></label>`;
  }).join("");

  const warn = r.warnings.map(w => `<div class="warnbox">⚠ ${esc(w)}</div>`).join("");
  const isCrit = m.forceCrit || r.autoCrit || (m.attackRoll && m.attackRoll.pick === 20);

  // roll results
  let rollHtml = "";
  if (m.attackRoll) {
    const a = m.attackRoll;
    const dice = a.rolls.map(x =>
      `<span class="die ${x === 20 ? "max" : x === 1 ? "min" : ""} ${a.rolls.length > 1 && x !== a.pick ? "dropped" : ""}">${x}</span>`).join("");
    rollHtml += `<div class="rollout">🎯 To hit: ${dice} ${fmtMod(r.attackBonus)} = <span class="total">${a.pick + r.attackBonus}</span>
      ${a.pick === 20 ? `<span class="crit"> NATURAL 20!</span>` : a.pick === 1 ? `<span class="crit"> Natural 1 — miss.</span>` : ""}</div>`;
  }
  if (m.damageRoll) {
    rollHtml += `<div class="rollout">💥 Damage${m.damageRoll.crit ? ` <span class="crit">(CRIT)</span>` : ""}:
      ${m.damageRoll.groups.map(g => `<div>${g.detail.map(d =>
        d.flat !== undefined ? `<span class="die">${d.flat >= 0 ? "+" + d.flat : d.flat}</span>`
        : `<span class="die ${d.roll === d.die ? "max" : d.roll === 1 ? "min" : ""}">${d.sign < 0 ? "−" : ""}${d.roll}</span>`).join("")}
        <b>${g.total}</b> ${esc(g.type)}${g.n > 1 ? ` <span class="muted">(${g.label} ${g.i + 1}/${g.n})</span>` : ""}</div>`).join("")}
      <div class="total">${m.damageRoll.grand} total</div></div>`;
  }
  if (m.healRoll) {
    rollHtml += `<div class="rollout">💚 Healing: ${m.healRoll.detail.map(d =>
      d.flat !== undefined ? `<span class="die">+${d.flat}</span>` : `<span class="die ${d.roll === d.die ? "max" : ""}">${d.roll}</span>`).join("")}
      = <span class="total">${m.healRoll.total} HP</span></div>`;
  }

  const hasDamage = r.damage.length > 0;
  $("#modalRoot").innerHTML = `<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="closebar">
        <div><h2>${esc(action.name)}</h2>
          <span class="pill ${esc(action.time)}">${cap(action.time || "")}</span>
          ${action.kind === "spell" ? `<span class="pill">${action.spellLevel === 0 ? "Cantrip" : "Level " + action.spellLevel}</span>` : ""}
          ${action.concentration ? `<span class="pill">Concentration</span>` : ""}
        </div>
        <button onclick="closeModal()">✕</button>
      </div>
      <p class="muted" style="margin-bottom:8px">${esc(action.description || "")}</p>
      ${slotPick}
      ${opts.length ? `<h3 style="font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);margin:10px 0 6px">Options</h3>${optHtml}` : ""}
      ${warn}
      <div class="instructions"><ol>${r.steps.map(s => `<li>${s}</li>`).join("")}</ol>
        ${r.notes.length ? `<div class="muted" style="margin-top:8px">${r.notes.map(n => `<div>• ${n}</div>`).join("")}</div>` : ""}</div>
      ${hasDamage ? `<div class="mmx">
        <div class="stat"><div class="v">${r.stats.min}</div><div class="l">Min</div></div>
        <div class="stat"><div class="v">${r.stats.avg}</div><div class="l">Average</div></div>
        <div class="stat"><div class="v">${r.stats.max}</div><div class="l">Max</div></div>
      </div>` : ""}
      <div class="btnrow">
        ${r.attackBonus !== null ? `<button class="btn" onclick="doAttackRoll()">🎲 Roll to hit</button>` : ""}
        ${hasDamage ? `<button class="btn" onclick="doDamageRoll()">🎲 Roll damage</button>
          <label class="chip" style="display:inline-flex;align-items:center;gap:5px"><input type="checkbox" ${m.forceCrit ? "checked" : ""} onchange="UI.modal.forceCrit=this.checked;UI.modal.damageRoll=null;renderActionModal()" style="accent-color:var(--accent)">Crit</label>` : ""}
        ${r.healing ? `<button class="btn" onclick="doHealRoll()">🎲 Roll healing</button>` : ""}
      </div>
      ${rollHtml}
      <div style="margin-top:14px" class="btnrow">
        <button class="btn primary" style="flex:1" onclick="doCommit()">✓ Use — spend costs & mark sheet</button>
      </div>
    </div>
  </div>`;
}

function toggleOpt(id) {
  const s = UI.modal.sel.opts;
  s.has(id) ? s.delete(id) : s.add(id);
  UI.modal.damageRoll = null; UI.modal.attackRoll = null;
  renderActionModal();
}

function doAttackRoll() {
  const ch = currentChar();
  const action = ch.actions.find(a => a.id === UI.modal.actionId);
  const r = resolveSelection(ch, action, UI.modal.sel);
  UI.modal.attackRoll = rollD20(r.advState);
  renderActionModal();
}

function doDamageRoll() {
  const ch = currentChar();
  const m = UI.modal;
  const action = ch.actions.find(a => a.id === m.actionId);
  const r = resolveSelection(ch, action, m.sel);
  const crit = m.forceCrit || r.autoCrit || (m.attackRoll && m.attackRoll.pick === 20);
  const groups = []; let grand = 0;
  for (let i = 0; i < r.count; i++) {
    for (const g of r.damage) {
      const roll = rollTerms(g.terms, { crit });
      groups.push({ type: g.type, total: Math.max(0, roll.total), detail: roll.detail, i, n: r.count, label: r.countLabel || "hit" });
      grand += Math.max(0, roll.total);
    }
  }
  m.damageRoll = { groups, grand, crit };
  renderActionModal();
}

function doHealRoll() {
  const ch = currentChar();
  const action = ch.actions.find(a => a.id === UI.modal.actionId);
  const r = resolveSelection(ch, action, UI.modal.sel);
  UI.modal.healRoll = rollTerms(r.healing.terms);
  renderActionModal();
}

function doCommit() {
  const ch = currentChar();
  const action = ch.actions.find(a => a.id === UI.modal.actionId);
  const r = resolveSelection(ch, action, UI.modal.sel);
  commitSelection(ch, action, UI.modal.sel, r);
  closeModal();
  UI.tab = "sheet";
  render();
}

function updChar(f, v) { currentChar()[f] = v; saveDB(); if (f === "name") render(); else renderEdit(); }
function setPortraitFile(file) {
  if (!file) return;
  const img = new Image();
  img.onload = () => {
    const MAXW = 440, MAXH = 560;
    const scale = Math.min(1, MAXW / img.width, MAXH / img.height);
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(img.width * scale);
    canvas.height = Math.round(img.height * scale);
    canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
    currentChar().portrait = canvas.toDataURL("image/jpeg", 0.78);
    URL.revokeObjectURL(img.src);
    saveDB(); renderEdit();
  };
  img.onerror = () => { alert("Couldn't read that image."); URL.revokeObjectURL(img.src); };
  img.src = URL.createObjectURL(file);
}

/* ----- list sorting (drag & drop + arrows) ----- */
function listOf(kind) { const ch = currentChar(); return kind === "actions" ? ch.actions : ch.options; }
function dragRow(ev, i, kind) { UI.drag = { i, kind }; ev.dataTransfer.effectAllowed = "move"; }
function overRow(ev, el) { ev.preventDefault(); el.classList.add("dragover"); }
function dropRow(ev, i, kind, el) {
  ev.preventDefault(); el.classList.remove("dragover");
  if (!UI.drag || UI.drag.kind !== kind) return;
  moveItemTo(kind, UI.drag.i, i); UI.drag = null;
}
function moveItemTo(kind, from, to) {
  if (from === to) return;
  const arr = listOf(kind);
  const [x] = arr.splice(from, 1);
  arr.splice(to, 0, x);
  saveDB(); renderEdit();
}
function moveItem(kind, i, d) {
  const j = i + d;
  if (j < 0 || j >= listOf(kind).length) return;
  moveItemTo(kind, i, j);
}

function findAction(id) { return currentChar().actions.find(a => a.id === id); }
function updAction(id, f, v) { findAction(id)[f] = v; saveDB(); renderEdit(); }
function updDamage(id, i, f, v) { findAction(id).damage[i][f] = v; saveDB(); renderEdit(); }
function addDamage(id) { findAction(id).damage.push({ expr: "1d6", type: "slashing" }); saveDB(); renderEdit(); }
function removeDamage(id, i) { findAction(id).damage.splice(i, 1); saveDB(); renderEdit(); }
function updUpcastMode(id, mode) {
  const a = findAction(id);
  a.upcast = mode === "none" ? null : (mode === "count" ? { mode: "count" } : { mode: "dice", expr: "1d6", type: (a.damage[0] && a.damage[0].type) || "fire" });
  saveDB(); renderEdit();
}
function updUpcast(id, f, v) { findAction(id).upcast[f] = v; saveDB(); renderEdit(); }
function updActionFlag(id, i, f, v) { findAction(id).setFlags[i][f] = v; saveDB(); renderEdit(); }
function addActionFlag(id) { const a = findAction(id); (a.setFlags = a.setFlags || []).push({ label: "Effect active", clear: "manual" }); saveDB(); renderEdit(); }
function removeActionFlag(id, i) { findAction(id).setFlags.splice(i, 1); saveDB(); renderEdit(); }
function updActionCost(id, i, f, v) { findAction(id).costs[i][f] = v; saveDB(); renderEdit(); }
function addActionCost(id) { const ch = currentChar(); findAction(id).costs.push({ type: "resource", id: ch.resources[0].id, amount: 1 }); saveDB(); renderEdit(); }
function removeActionCost(id, i) { findAction(id).costs.splice(i, 1); saveDB(); renderEdit(); }
function addAction() { const a = featureAction({ name: "New action", description: "" }); currentChar().actions.push(a); UI.editActionId = a.id; saveDB(); renderEdit(); }
function addFromLibrary() {
  const idx = parseInt($("#libPick").value, 10);
  const a = weaponAction(WEAPON_LIBRARY[idx].name);
  currentChar().actions.push(a); UI.editActionId = a.id; saveDB(); renderEdit();
}
function duplicateAction(id) {
  const a = JSON.parse(JSON.stringify(findAction(id)));
  a.id = uid(); a.name += " (copy)";
  currentChar().actions.push(a); UI.editActionId = a.id; saveDB(); renderEdit();
}
function deleteAction(id) {
  if (!confirm("Delete this action?")) return;
  const ch = currentChar(); ch.actions = ch.actions.filter(a => a.id !== id);
  UI.editActionId = null; saveDB(); renderEdit();
}
